[project]
name = "sci"
version = "0.1.0"
description = "Science news to verified Italian drafts: RSS ingestion, primary-source binding, cross-source corroboration and claim-level verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "feedparser>=6.0.11",
    "pyyaml>=6.0.1",
]

[project.scripts]
sci = "sci.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
