# Feed registry for the sci pipeline.
#
# independence:
#   1.0  original reporting with its own newsroom and editorial judgement
#   0.5  mixed: some original reporting, heavy syndication
#   0.0  press-release republisher — echoes the institutional PR near-verbatim.
#
# A story confirmed only by independence-0.0 outlets is NOT corroborated.
# It is the same press release counted several times. The pipeline records
# those separately as `echo` and never as `independent`.

primary:
  - id: science_news
    name: Science — Latest News
    url: https://www.science.org/rss/news_current.xml
    lang: en

corroborators:
  - id: nature
    name: Nature
    url: https://www.nature.com/nature.rss
    independence: 1.0
    lang: en

  - id: ars_science
    name: Ars Technica — Science
    url: https://arstechnica.com/science/feed/
    independence: 1.0
    lang: en

  # The six newsrooms below widen the independent pool from two to eight
  # (ADR-003). Each comment records the date the url above it last returned
  # HTTP 200 with parseable items, and how many it carried. Re-probe before
  # trusting a date older than a few months.

  - id: guardian_science
    name: The Guardian — Science
    # verified 2026-10-04: HTTP 200, 27 items
    url: https://www.theguardian.com/science/rss
    independence: 1.0
    lang: en

  - id: bbc_science
    name: BBC — Science & Environment
    # verified 2026-10-04: HTTP 200, 42 items
    url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    independence: 1.0
    lang: en

  - id: nyt_science
    name: NYT — Science
    # verified 2026-10-04: HTTP 200, 29 items
    url: https://rss.nytimes.com/services/xml/rss/nyt/Science.xml
    independence: 1.0
    lang: en

  - id: stat_news
    name: STAT News
    # verified 2026-10-04: HTTP 200, 20 items
    url: https://www.statnews.com/feed/
    independence: 1.0
    lang: en

  - id: new_scientist
    name: New Scientist — News
    # verified 2026-10-04: HTTP 200, 10 items
    # (newscientist.com/subject/news/feed/ returns 404; this is the live path)
    url: https://www.newscientist.com/section/news/feed/
    independence: 1.0
    lang: en

  - id: quanta
    name: Quanta Magazine
    # verified 2026-10-04: HTTP 200, 5 items
    url: https://www.quantamagazine.org/feed/
    independence: 1.0
    lang: en

  - id: phys_org
    name: Phys.org
    url: https://phys.org/rss-feed/
    independence: 0.0
    lang: en

  - id: sciencedaily
    name: ScienceDaily
    url: https://www.sciencedaily.com/rss/all.xml
    independence: 0.0
    lang: en

  - id: medicalxpress
    name: MedicalXpress
    url: https://medicalxpress.com/rss-feed/
    independence: 0.0
    lang: en

# Deliberately absent:
#   eurekalert  — every documented feed path returns 404 (checked 2026-08-03).
#   nature news — nature.com/subjects/news.rss returns 404 (checked 2026-08-03).
#   altmetric   — public API returns 403 without a key.
#   sciadv      — Science Advances TOC feed carries no abstract, and matched
#                 1 of 120 sampled news items (checked 2026-09-25). A journal
#                 is never a corroborator: see ADR-009.
# Do not re-add without re-probing; a silently dead feed looks like
# "no corroboration found" and biases every score downward.
